# ============================================================================
#  北民大小助手（beimingda）· nginx 反代片段
# ----------------------------------------------------------------------------
#  链路（服务器实况）：Cloudflare Tunnel → nginx :80 → 127.0.0.1:3000
#    · TLS 由 Cloudflare 边缘签发（源站不需要证书），所以这里只监听 :80
#    · 后端只监听回环地址，不直接暴露公网
#    · 本项目**不用 SSE / WebSocket**：MCP 是"单请求单响应"的 POST /mcp，
#      所以不需要 Upgrade/Connection 头，也不要有"长连接保活"的配置
#
#  用法（Debian/Ubuntu）：
#    sudo cp deploy/nginx-demo.conf /etc/nginx/sites-available/beimingda.conf
#    sudo ln -sf /etc/nginx/sites-available/beimingda.conf /etc/nginx/sites-enabled/beimingda.conf
#    sudo nginx -t && sudo systemctl reload nginx
#  （若你的 nginx 用 conf.d/：直接 cp 到 /etc/nginx/conf.d/beimingda.conf，效果相同）
# ============================================================================

server {
    # CF 隧道回源时会带上正确的 Host（demo.knowingly.dpdns.org），所以这里不需要 default_server。
    # ⚠️ 若本机 :80 上已有别的站点占了 default_server，就**不要**加 default_server（nginx -t 会报
    #    "duplicate default server"）；只有在没有别的默认站点时，才把下面这行换成：
    #      listen 80 default_server;
    listen 80;
    server_name demo.knowingly.dpdns.org;

    # 发布代取任务时可带一张截图（base64 走 JSON，最多到 2MB 左右），留出余量。
    # 后端自身还有 express.json({ limit: "2mb" }) —— 这里别小于它，否则会提前 413。
    client_max_body_size 5m;

    access_log /var/log/nginx/beimingda.access.log;
    error_log  /var/log/nginx/beimingda.error.log warn;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ------------------------------------------------------------------------
    # 真实访客 IP（强烈建议；缺这段会让"按 IP 限频"退化成所有人共用一个桶）
    # ------------------------------------------------------------------------
    # 链路是 cloudflared 在本机连 nginx，所以直接信任 127.0.0.1，用 CF 的访客 IP 覆盖 remote_addr。
    # 需要 nginx 带 ngx_http_realip_module（Debian/Ubuntu 官方包默认带）。
    # 这样 $remote_addr 与后面的 X-Forwarded-For 首段都是真实访客 IP，
    # 后端的限频（src/middleware/ratelimit.js 取 XFF 第一段）才是"每人一份"。
    # 若你的 nginx 没有 realip 模块，删掉这 3 行；但要接受：写接口限频会变成"全局 60 次/分钟"。
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # ---- 公共代理头 --------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    # 本项目不用长连接/SSE，所以**不设** Upgrade / Connection 头

    # ------------------------------------------------------------------------
    # 1) MCP 端点：POST /mcp —— 关缓冲 + 放长读超时
    # ------------------------------------------------------------------------
    # 为什么关缓冲：MCP 是"请求-响应"，但客户端（WorkBuddy）在等 structuredContent；
    #   nginx 缓冲只会让 TTFB 变差、还可能把 401/429 的错误体延后。
    # 为什么 90s：Cloudflare 免费版有 100 秒硬超时（项目硬约束），
    #   留 10 秒余量，∧ 与后端"单次响应 < 90 秒"的设计一致。
    location = /mcp {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_connect_timeout 5s;
        # MCP 的响应是每次现算的 JSON，任何一层缓存都可能把"刚发布的任务"缓存掉
        add_header Cache-Control "no-store" always;
    }

    # 自检/探活用的 GET /mcp（返回能力描述）与显式拒绝的 /mcp/sse
    location /mcp/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    # ------------------------------------------------------------------------
    # 2) HTTP API：/api/ —— 同样关缓冲；GET（读）与写接口共用
    # ------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_connect_timeout 5s;
        # 接口全是 JSON，界面靠轮询拿新数据（搭子墙 3~5 秒一次），不能被缓存
        add_header Cache-Control "no-store" always;
    }

    # ------------------------------------------------------------------------
    # 3) /config.js —— 运行时注入配置（站点域名 / 高德 key / 演示令牌）
    # ------------------------------------------------------------------------
    # ⛔ 绝不缓存：它随环境变量变化，缓存住会让评委拿到旧域名或"未配置"状态。
    location = /config.js {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ------------------------------------------------------------------------
    # 4) 静态资源：给长缓存（内容不变就一直是同一个文件）
    # ------------------------------------------------------------------------
    location ~* \.(?:css|js|mjs|svg|png|jpe?g|webp|gif|ico|woff2?|ttf|map)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 30s;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # 全景图体积大：独立给缓存（换图后靠改文件名/清缓存，见 部署与运维.md）
    location /pano/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 60s;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ------------------------------------------------------------------------
    # 5) 页面与其余路径：HTML 不做强缓存（否则发版后评委看到的是旧页面）
    # ------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-cache" always;
    }
}
