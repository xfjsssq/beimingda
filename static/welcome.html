<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>迎新导览：校园地图与 3D 街景</title>
  <link rel="stylesheet" href="/css/app.css" />
  <!-- 本地化的 Leaflet（BSD-2，见 vendor/leaflet/LICENSE）：站内自建卫星图层用 -->
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/vendor/pannellum/pannellum.css" />
  <style>
    /* 本页只保留「地图 / 全景 / 高德视图」特有样式，其余全走 /css/app.css */
    :root {
      --pri: var(--color-primary); --ok: var(--color-accent); --warn: var(--color-danger);
      --card: #FFFFFF; --line: var(--color-line); --muted: var(--color-muted);
    }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 12px; }
    .chip { border: 1px solid var(--line); background: #fff; color: var(--muted);
      padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; }
    .chip[aria-pressed="true"] { background: var(--pri); border-color: var(--pri); color: #fff; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; align-items: start; }
    .map-card { background: var(--card); border-radius: 12px; padding: 10px;
      box-shadow: 0 1px 3px rgba(16,24,40,.08); }
    .map-wrap { position: relative; width: 100%; overflow: hidden; border-radius: 8px; }
    .map-wrap img.base { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
    .marker { position: absolute; transform: translate(-50%, -100%); cursor: pointer;
      background: none; border: 0; padding: 0; line-height: 1; }
    .marker .dot { display: block; width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
    .marker .tag { display: block; margin-top: 3px; font-size: 11px; background: rgba(255,255,255,.92);
      border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; white-space: nowrap; }
    .marker[data-cat="dorm"] .dot     { background: #1F4E8C; }
    .marker[data-cat="canteen"] .dot  { background: #E08C1B; }
    .marker[data-cat="teaching"] .dot { background: #2E8B76; }
    .marker[data-cat="gate"] .dot     { background: #7A5AF8; }
    .marker[data-cat="service"] .dot  { background: #C0392B; }
    .marker[aria-current="true"] .dot { outline: 3px solid rgba(31,78,140,.35); }
    .marker[hidden] { display: none; }
    .source { margin: 8px 2px 0; font-size: 12px; color: var(--muted); }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
      box-shadow: 0 1px 3px rgba(16,24,40,.08); position: sticky; top: calc(var(--header-h) + 12px); }
    .panel h2 { margin: 0 0 6px; font-size: 17px; }
    .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px;
      background: rgba(31,78,140,.1); color: var(--pri); margin-right: 6px; }
    .badge.pano-on  { background: rgba(46,139,118,.14); color: var(--ok); }
    .badge.pano-off { background: rgba(192,57,43,.12); color: var(--warn); }
    .panel p.desc { font-size: 14px; line-height: 1.65; color: #333; }
    .notice { font-size: 13px; background: #FFF8E6; border: 1px solid #F0DFAC; color: #6B5A18;
      border-radius: 8px; padding: 8px 10px; margin: 10px 0 0; }
    button.primary { background: var(--pri); color: #fff; border: 0; border-radius: 8px;
      padding: 9px 14px; font-size: 14px; cursor: pointer; }
    /* ⭐ 先做成"小窗"：放入口的选单要显示在上层，全屏时会被盖住。
     等点位标好之后再改回全屏（把下面这段的 width/height 改成 100vw/100vh 即可）。 */
  #panoOverlay { position: fixed; top: 64px; left: 24px;
    width: min(980px, 62vw); height: min(640px, 64vh);
    background: #000; display: none; z-index: 45; border-radius: 16px; overflow: hidden;
    box-shadow: 0 24px 60px -20px rgba(0,0,0,.55); }
  @media (max-width: 900px) { #panoOverlay { left: 12px; top: 56px; width: calc(100vw - 24px); height: 52vh; } }
    #panoOverlay.on { display: block; }
    #pano { width: 100%; height: 100%; }
    .pano-bar { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 2;
      display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .pano-bar .title { color: #fff; font-size: 15px; background: rgba(0,0,0,.45);
      padding: 6px 12px; border-radius: 8px; }
    .pano-bar button { background: rgba(0,0,0,.55); color: #fff; border: 1px solid rgba(255,255,255,.35);
      border-radius: 8px; padding: 6px 12px; cursor: pointer; }
    /* ---- 高德地图辅助入口（需联网；底图仍是离线可用的截图） ---- */
    .map-tools { display: flex; gap: 8px; align-items: center; justify-content: flex-end;
      flex-wrap: wrap; margin: 0 2px 8px; }
    .map-tools .hint { font-size: 12px; color: var(--muted); margin-right: auto; }
    .ghost { background: #fff; color: var(--pri); border: 1px solid var(--pri); border-radius: 8px;
      padding: 6px 12px; font-size: 13px; cursor: pointer; }
    .ghost:hover { background: rgba(31,78,140,.06); }
    .ghost[aria-pressed="true"] { background: var(--pri); border-color: var(--pri); color: #fff; }
    .ghost:disabled { opacity: .5; cursor: not-allowed; }
    #amapWrap { position: relative; }
    #amapCanvas { width: 100%; height: 460px; border-radius: 8px; overflow: hidden; background: #10161f; }
    .amap-tip { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 3;
      background: rgba(12,18,28,.82); color: #fff; font-size: 12px; line-height: 1.6;
      padding: 8px 10px; border-radius: 8px; }
    .amap-marker { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.4); cursor: pointer; }
    .amap-marker.dorm { background: #1F4E8C; }
    .amap-marker.canteen { background: #E08C1B; }
    .amap-marker.teaching { background: #2E8B76; }
    .amap-marker.gate { background: #7A5AF8; }
    .amap-marker.service { background: #C0392B; }
    @media (max-width: 768px) { #amapCanvas { height: 340px; } }
    #amapOverlay { position: fixed; inset: 0; background: rgba(12,18,28,.9); display: none; z-index: 55; }
    #amapOverlay.on { display: block; }
    .amap-shell { position: absolute; inset: 22px; background: #0f1720; border-radius: 12px; overflow: hidden; }
    #amapFrame, #amapFrame iframe { width: 100%; height: 100%; border: 0; display: block; }
    .amap-bar { position: relative; z-index: 2; display: flex; justify-content: space-between;
      align-items: center; gap: 10px; padding: 8px 12px; background: #16202e; color: #fff; font-size: 13px; }
    .amap-bar button { background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.35);
      border-radius: 8px; padding: 5px 12px; cursor: pointer; }
    @media (max-width: 768px) { .amap-shell { inset: 8px; } }
    /* 标签避让：同排会压字的点位，第二个标签改到圆点上方（由 JS 按坐标与字宽判定） */
    .marker--alt .tag { position: absolute; bottom: 27px; left: 50%;
      transform: translateX(-50%); margin-top: 0; box-shadow: 0 1px 4px rgba(16,24,40,.12); }
    @media (max-width: 768px) {
      .layout { display: block; }
      .panel { position: static; }
      .marker .tag { display: none; }
      .marker .dot { width: 18px; height: 18px; }
      /* 窄屏默认只留圆点，但当前选中的点位仍显示名字 */
      .marker[aria-current="true"] .tag { display: block; }
    }

    /* ---------- 地图舞台 + 浮在地图上的功能按键（⭐ 3D 街景入口在这里） ---------- */
    .map-stage { position: relative; }
    .map-hud { position: absolute; top: 10px; right: 10px; z-index: 6;
      display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
    .map-hud .segmented { background: rgba(255,255,255,.94); border-color: rgba(31,78,140,.18);
      box-shadow: 0 3px 12px rgba(16,24,40,.18); backdrop-filter: blur(6px); }
    .map-hud__row { display: flex; gap: 8px; }
    .map-hud__btn { display: inline-flex; align-items: center; gap: 6px; font-family: inherit;
      background: rgba(255,255,255,.94); border: 1px solid rgba(31,78,140,.18); color: var(--pri);
      border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer;
      box-shadow: 0 3px 12px rgba(16,24,40,.14); }
    .map-hud__btn:hover { background: #fff; }
    .map-badge { position: absolute; left: 10px; right: 10px; bottom: 10px; margin: 0; z-index: 6;
      background: rgba(15,26,43,.88); color: #fff; font-size: 12.5px; line-height: 1.55;
      padding: 8px 12px; border-radius: 10px; }
    .map-badge[hidden] { display: none; }
    @media (max-width: 640px) {
      .map-hud { top: 8px; right: 8px; gap: 6px; }
      .map-hud__btn .label { display: none; }        /* 窄屏只留图标，不挤 */
      .map-hud .segmented__btn { padding: 6px 10px; font-size: 12px; }
    }

    /* ---------- 3D 街景查看器 ---------- */
    #panoOverlay { background: #0b1220; }
    .street-bar { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 3;
      display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .street-bar .title { color: #fff; font-size: 14.5px; background: rgba(0,0,0,.5);
      padding: 6px 12px; border-radius: 8px; }
    .street-pick { display: flex; gap: 6px; flex-wrap: wrap; }
    .street-pick button { font-family: inherit; cursor: pointer; font-size: 13px;
      background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.32);
      border-radius: 999px; padding: 5px 12px; }
    .street-pick button[aria-pressed="true"] { background: #fff; color: var(--pri); font-weight: 600; }
    .street-fallback[hidden] { display: none; }   /* ⚠️ 必须写：自定义 display 会盖掉 [hidden] 的 UA 样式 */
    .street-fallback { position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; padding: 20px; }
    .street-fallback .card { max-width: 460px; text-align: center; }
    .street-fallback img { width: 168px; max-width: 60%; height: auto; margin-bottom: 6px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
  .field__label { font-size: 12px; color: var(--color-muted); }
  .input--color { padding: 2px; height: 36px; }
  .sat-pop b { display: block; margin-bottom: 4px; }
  .sat-pop p { margin: 0 0 8px; }
  .sat-map-hint { font-size: 12px; }
  /* 地图是这一页的主角：占满宽、给足高度 */
  .layout { display: block; }
  .map-wrap { height: clamp(420px, 66vh, 780px); }
  .map-zoomable { position: absolute; inset: 0; will-change: transform; }
  /* 标记层独立：不参与缩放，所以放大后点位与文字都清晰 */
  .map-markers { position: absolute; inset: 0; pointer-events: none; }
  .map-markers .marker { position: absolute; pointer-events: auto; transform: translate(-50%, -100%); }
  .map-markers .marker .tag { white-space: nowrap; }
  .map-zoomable img.base { width: 100%; height: 100%; object-fit: contain; }
  /* ⚠️ Leaflet 的图层 z-index 是 400+，会把 HUD 和徽标盖住 → 明确压层 */
  #satWrap { z-index: 0; }
  .leaflet-container { z-index: 0; }
  .map-hud { z-index: 900; }
  .map-badge, .map-credit, .map-zoom { z-index: 800; }
  #panoOverlay, #amapOverlay { z-index: 1200; }
  .sat-pop { min-width: 180px; }

  /* ---------- 3D 街景：点位校准（双击加点） ---------- */
  .sat-editor { position: absolute; left: 10px; bottom: 10px; z-index: 900; display: flex; align-items: center;
    gap: 8px; padding: 6px 10px; border-radius: 9999px; background: rgba(255,255,255,.94);
    border: 1px solid rgba(31,78,140,.18); box-shadow: 0 6px 20px -10px rgba(16,24,40,.4); }
  .sat-editor__hint { font-size: 12px; color: var(--color-muted); }
  .sat-editor__count { font-size: 13px; color: var(--color-primary); min-width: 34px; }
  .sat-marker--draft .sat-marker__dot { background: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,.28); }
  .sat-marker--draft .sat-marker__label { border-color: rgba(124,58,237,.55); color: #5b21b6; }
  .sat-marker--draft.is-dragging .sat-marker__dot { transform: scale(1.35); }

  /* ---------- 街景入口编辑器（双击画面放热点） ---------- */
  .hs-editor { position: absolute; left: 12px; bottom: 12px; z-index: 1200; display: flex; align-items: center;
    gap: 8px; padding: 6px 10px; border-radius: 9999px; background: rgba(255,255,255,.94);
    border: 1px solid rgba(31,78,140,.18); box-shadow: 0 6px 20px -10px rgba(16,24,40,.4); }
  .hs-editor__hint { font-size: 12px; color: var(--color-muted); }
  .hs-editor__count { font-size: 13px; color: var(--color-primary); min-width: 18px; }
  /* 编辑期的入口：看得出来是"我们自己放的"，并且可拖 */
  .pnlm-hotspot.hs-edit { cursor: move !important; }
  .pnlm-hotspot.hs-edit::after { content: ""; position: absolute; inset: -10px; border: 2px dashed rgba(124,58,237,.85);
    border-radius: 9999px; pointer-events: none; }
  .pnlm-hotspot.hs-edit.is-dragging { opacity: .85; }
</style>

<main class="page" id="main">

<script type="module">
import { mountNav } from "/js/nav.js";
import { initDemo } from "/js/demo.js";
import { createSheet, toast } from "/js/ui.js";
import { el, esc, copyText } from "/js/ui.js";

const $ = (s) => document.querySelector(s);
const CAT_LABEL = { dorm: "宿舍楼", canteen: "食堂", teaching: "教学与自习", gate: "校门", service: "服务设施" };

mountNav();
initDemo();

let NODES = [];
let BG = { image: "/map/campus-map.jpg", points: {}, attribution: "" };
let MANIFEST = { default: { firstScene: "", sceneFadeDuration: 800 }, scenes: {} };
let filter = "";
let currentId = "";

async function getJson(url, fallback) {
  try {
    const r = await fetch(url);
    if (!r.ok) return fallback;
    return await r.json();
  } catch { return fallback; }
}

/**
 * 取 /api/* 的数据并**解掉统一信封** `{ok,data,error}`（contracts/core.md）。
 * ⚠️ 曾经这里直接 `Array.isArray(nodes) ? nodes : []`，而接口返回的是信封对象 →
 *    NODES 恒为空数组 → 地图上一个点位都不画、右侧还谎报"节点未就绪"。
 * 现在：数组直接用；信封且 ok:true 用 .data；其余一律回退，绝不猜。
 */
async function getApiData(url, fallback) {
  const body = await getJson(url, null);
  if (Array.isArray(body)) return body;                       // 兼容裸数组
  if (body && body.ok === true && body.data != null) return body.data;
  return fallback;
}

function catLabel(c) { return CAT_LABEL[c] || c; }

/* ---------- 坐标校准模式（?calibrate=1） ----------
   ⚠️ 本项目**不猜点位坐标**：底图上每个点的百分比坐标必须由人对着真实校园图点出来。
   用法：/welcome?calibrate=1 → 在右下角列表选一个点位 → 在底图上点它的真实位置
        → 页面给出可直接粘贴进 static/map/map-bg.json 的 JSON 片段（同时就地移动标记）。
   ⛔ 校准结果只在本页内存里生效，不会自动写文件；请把 JSON 粘回 map-bg.json 再刷新。 */
function setupCalibrate() {
  if (new URLSearchParams(location.search).get("calibrate") !== "1") return;
  let cur = NODES[0]?.id ?? "";
  const box = document.createElement("div");
  box.id = "calibBox";
  box.style.cssText =
    "position:fixed;right:12px;bottom:12px;z-index:80;max-width:360px;background:#0f172a;color:#e2e8f0;" +
    "border-radius:10px;padding:12px 14px;font:12px/1.6 Consolas,monospace;box-shadow:0 6px 24px rgba(0,0,0,.35)";
  const labelOf = (id) => (NODES.find((n) => n.id === id)?.label ?? id) + "（" + id + "）";
  box.innerHTML =
    '<div style="font-weight:700;margin-bottom:6px">坐标校准模式</div>' +
    '<div style="opacity:.85;margin-bottom:8px">选点位 → 在底图上点它的真实位置。结果粘回 <b>static/map/map-bg.json</b> 的 points。</div>' +
    '<select id="calibSel" style="width:100%;padding:6px;border-radius:6px;margin-bottom:8px">' +
    NODES.map((n) => `<option value="${esc(n.id)}">${esc(n.label)}（${esc(n.id)}）</option>`).join("") +
    "</select>" +
    '<pre id="calibOut" style="margin:0;background:#111c2e;padding:8px;border-radius:6px;white-space:pre-wrap;word-break:break-all">点一下底图开始</pre>';
  document.body.appendChild(box);
  const sel = box.querySelector("#calibSel");
  const out = box.querySelector("#calibOut");
  sel.value = cur;
  sel.addEventListener("change", () => { cur = sel.value; });

  $("#mapWrap").addEventListener("click", (e) => {
    const img = $("#baseImg");
    if (!img || e.target.closest(".marker")) return;            // 别把点击标记当成校准
    const r = img.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const x = +(((e.clientX - r.left) / r.width) * 100).toFixed(1);
    const y = +(((e.clientY - r.top) / r.height) * 100).toFixed(1);
    if (x < 0 || x > 100 || y < 0 || y > 100) return;
    BG.points[cur] = { x_pct: x, y_pct: y };
    const json = `"${cur}": { "x_pct": ${x}, "y_pct": ${y} }`;
    out.textContent = labelOf(cur) + "\n" + json;
    try { navigator.clipboard?.writeText(json); out.textContent += "\n（已复制）"; } catch {}
  });
}

/* 标签避让：宿舍区（dorm-3/12/15）与食堂区（canteen-1/2）点位密集，标签原来互相压字。
   做法：按 y 分成「同排」（纵向差 <6%），排内按 x 排序，用两条车道（标签在点下方 / 上方），
   按字数估算标签宽度并与前标签右缘比较，放不下就换车道。⛔ 不改动任何点位坐标。 */
function avoidLabelOverlap() {
  const wrap = $("#mapWrap");
  const width = wrap.clientWidth || 0;
  const items = [...wrap.querySelectorAll(".marker")].filter((m) => !m.hidden);
  for (const m of items) m.classList.remove("marker--alt");
  if (!width || items.length < 2) return;
  const rows = [];
  for (const m of items) {
    const x = parseFloat(m.style.left), y = parseFloat(m.style.top);
    let row = rows.find((r) => Math.abs(r.y - y) < 6);
    if (!row) { row = { y, list: [] }; rows.push(row); }
    row.list.push({ m, x });
  }
  for (const row of rows) {
    row.list.sort((a, b) => a.x - b.x);
    const laneEnd = [-Infinity, -Infinity]; // 0 = 标签在点下方，1 = 标签在点上方
    for (const it of row.list) {
      const tag = it.m.querySelector(".tag");
      const chars = (tag ? tag.textContent : "").length;
      const half = ((chars * 11 + 14) / 2 / width) * 100; // 标签半宽（百分比）
      let lane = it.x - half < laneEnd[0] ? 1 : 0;
      if (it.x - half < laneEnd[lane]) lane = lane === 0 ? 1 : 0;
      if (lane === 1) it.m.classList.add("marker--alt");
      laneEnd[lane] = it.x + half;
    }
  }
}

/* 示意图不再放点位标注（用户要求）：底图只做缩放浏览；点位只在卫星图/3D 街景上显示 */
/** 底图在容器里的实际摆放（object-fit: contain）：缩放/平移都用它算标记位置 */
function imageGeometry() {
  const wrap = $("#mapWrap"), img = $("#baseImg");
  const nw = img.naturalWidth || 1279, nh = img.naturalHeight || 854;
  const w = wrap.clientWidth, hh = wrap.clientHeight;
  const k = Math.min(w / nw, hh / nh);
  const dw = nw * k, dh = nh * k;
  return { ox: (w - dw) / 2, oy: (hh - dh) / 2, dw, dh };
}

/** 把标记放到"像素坐标"上：缩放只影响图，标记层不动 → 文字永远清晰 */
function layoutMarkers(geo) {
  const g = geo || imageGeometry();
  const layer = $("#markerLayer");
  if (!layer) return;   // 示意图已不放标注，这里只在有标记层时工作
  for (const el of layer.querySelectorAll(".marker")) {
    const px = Number(el.dataset.x), py = Number(el.dataset.y);
    const x = g.ox + (px / 100) * g.dw * zoomState.z + zoomState.x;
    const y = g.oy + (py / 100) * g.dh * zoomState.z + zoomState.y;
    el.style.left = x + "px";
    el.style.top = y + "px";
  }
}

/* ---------- 底图切换：截图底图（离线兜底）↔ 高德卫星图（JS API，可拖动缩放 + 我们的点位） ----------
   key 由 /config.js 注入（window.__AMAP_KEY__），⛔ 页面不硬编码；
   加载失败 / 无 key / 坐标未录 → 自动留在截图底图并给出可操作提示（路演断网也不会白屏）。 */
const amapState = { sdk: null, map: null, active: false };

function amapConfig() { return (BG && BG.jsapi) || {}; }

/** 地图视图分段控制（示意图 / 卫星图 / 3D 街景）；street 是"打开查看器"而不是换底图，所以不高亮 */
function setBasePressed(which) {
  const map = { shot: "shot", amap: "sat", sat: "sat" };
  const want = map[which] || "shot";
  document.querySelectorAll("#viewSeg [data-view]").forEach((b) => {
    const on = b.dataset.view === want;
    b.setAttribute("aria-pressed", on ? "true" : "false");
  });
  const street = document.querySelector('#viewSeg [data-view="street"]');
  if (street) street.setAttribute("aria-pressed", "false");
}

function amapTip(text) {
  const el = $("#amapTip");
  el.hidden = !text;
  el.textContent = text || "";
}

function loadAmapSdk() {
  if (amapState.sdk) return amapState.sdk;
  amapState.sdk = new Promise((resolve, reject) => {
    const cfg = amapConfig();
    const key = window.__AMAP_KEY__ || cfg.key || "";
    const sec = window.__AMAP_SECURITY_CODE__ || "";
    if (!key) return reject(new Error("NO_KEY"));
    const tpl = cfg.sdk_url_template;
    if (!tpl) return reject(new Error("NO_SDK_URL"));   // ⛔ SDK 地址只从 /map/map-bg.json 读，不硬编码
    if (sec) window._AMapSecurityConfig = { securityJsCode: sec };
    const s = document.createElement("script");
    s.src = tpl.replace("{key}", key);
    s.async = true;
    const timer = setTimeout(() => reject(new Error("TIMEOUT")), 12000);
    s.onload = () => { clearTimeout(timer); window.AMap ? resolve(window.AMap) : reject(new Error("NO_AMAP")); };
    s.onerror = () => { clearTimeout(timer); reject(new Error("LOAD_FAIL")); };
    document.head.appendChild(s);
  });
  return amapState.sdk;
}

function coordsOf(n) {
  const lat = Number(n.lat), lng = Number(n.lng);
  return lat && lng ? [lng, lat] : null;      // ⛔ 坐标缺失就不画，绝不猜位置
}

async function useAmapBase() {
  const cfg = amapConfig();
  try {
    amapTip("正在加载高德地图…");
    const AMap = await loadAmapSdk();
    if (!amapState.map) {
      amapState.map = new AMap.Map("amapCanvas", {
        zoom: cfg.zoom || 16,
        center: [cfg.center ? cfg.center.lng : 116.397, cfg.center ? cfg.center.lat : 39.909],
        viewMode: "2D",
        mapStyle: cfg.map_style || undefined,
      });
      if (!cfg.disable_satellite_layer) {
        amapState.map.add(new AMap.TileLayer.Satellite());
        if (!cfg.disable_roadnet_layer) amapState.map.add(new AMap.TileLayer.RoadNet());
      }
    }
    renderAmapMarkers(AMap);
    $("#mapWrap").hidden = true;
    $("#amapWrap").hidden = false;
    setBasePressed("amap");
    amapState.active = true;
    const n = NODES.filter((x) => coordsOf(x)).length;
    amapTip(n
      ? "高德卫星图（GCJ-02）· 已落 " + n + " 个点位 · 点圆点看详情" + (n < NODES.length ? "；其余 " + (NODES.length - n) + " 个点位坐标待录入" : "")
      : "高德卫星图已加载，但 map_nodes 的 lat/lng 还是占位 0 —— 点位坐标待录入（用 /tools/pick.html 点选后写进 config/map-nodes.json）");
  } catch (e) {
    const why = e.message === "NO_KEY" ? "未配置高德 key（环境变量 AMAP_JS_KEY）"
      : e.message === "NO_SDK_URL" ? "缺少 SDK 地址配置（/map/map-bg.json 的 jsapi.sdk_url_template）"
      : e.message === "TIMEOUT" ? "加载超时（网络不可达？）"
      : "加载失败（域名白名单不含当前域名？）";
    // ⭐ 精确化：把"为什么打不开"和"下一步该怎么办"直接写清楚，并自动兜底到官方嵌入卫星图
    const host = location.hostname || location.host;
    const domainRelated = ["NO_AMAP", "LOAD_FAIL", "TIMEOUT"].includes(e.message);
    const msg = domainRelated && window.__AMAP_KEY__
      ? "高德 key 本身有效，但当前域名 " + host + " 不在该 key 的白名单里（高德返回 INVALID_USER_DOMAIN）。" +
        "请到高德控制台把 " + host + " 加入白名单；现在先给你用官方嵌入的卫星图。"
      : "已留在示意图底图：" + why;
    amapTip(msg);
    setBasePressed("shot");
    amapState.active = false;
    if (domainRelated && typeof openAmapEmbed === "function") openAmapEmbed();   // 兜底：照样能看卫星图
  }
}

function renderAmapMarkers(AMap) {
  if (!amapState.map) return;
  amapState.map.clearMap();
  for (const n of NODES) {
    const pos = coordsOf(n);
    if (!pos) continue;
    const marker = new AMap.Marker({
      position: pos,
      offset: new AMap.Pixel(-11, -11),
      content: '<div class="amap-marker ' + n.category + '" title="' + n.label + '"></div>',
    });
    marker.on("click", () => selectNode(n.id));
    amapState.map.add(marker);
  }
}

/* ---------- 高德官方嵌入（零 key 卫星图）：独立入口，也是 JS API 被域名白名单拒绝时的兜底 ---------- */
function openAmapEmbed() {
  const cfgAmap = (BG && BG.amap) || {};          // ⚠️ 必须在调用时取：BG 是 init 里异步加载的
  if (!cfgAmap.embed_url_template || !cfgAmap.center) return false;
  const url = cfgAmap.embed_url_template
    .replace("{lng}", cfgAmap.center.lng).replace("{lat}", cfgAmap.center.lat)
    .replace("{zoom}", cfgAmap.zoom || 17).replace("{maptype}", cfgAmap.maptype || "satellite");
  const frame = $("#amapFrame");
  if (frame && !frame.firstChild) {
    frame.innerHTML = '<iframe src="' + url + '" loading="lazy" allowfullscreen ' +
      'referrerpolicy="strict-origin-when-cross-origin"></iframe>';
  }
  $("#amapOverlay").classList.add("on");
  return true;
}

/* ---------- ⭐ 3D 街景（Pannellum；素材由 tools/stitch-pano.py 从实拍 180°×2 拼出） ---------- */
/** 某个点位对应的场景 id：优先按 pano_url 匹配，其次允许节点 id 直接等于场景 id */
function sceneOf(node) {
  if (!node) return null;
  const scenes = MANIFEST.scenes || {};
  if (node.pano_url) {
    const file = String(node.pano_url).split("/").pop();
    const hit = Object.keys(scenes).find((k) => String(scenes[k].panorama || "").endsWith(file));
    if (hit) return hit;
  }
  return scenes[node.id] ? node.id : null;
}

let streetViewer = null;
let streetScene = null;

function renderStreetPick() {
  const box = $("#streetPick");
  if (!box) return;
  box.innerHTML = "";
  for (const [id, sc] of Object.entries(MANIFEST.scenes || {})) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = sc.title || id;
    b.setAttribute("aria-pressed", id === streetScene ? "true" : "false");
    b.addEventListener("click", () => openStreetScene(id));
    box.appendChild(b);
  }
}


function openStreetScene(sceneId) {
  const scenes = MANIFEST.scenes || {};
  if (!scenes[sceneId]) return;
  streetScene = sceneId;
  // 遮罩由函数自己保证可见：深链 ?pano=、卡片按钮、场景切换都走这里
  $("#panoOverlay").classList.add("on");
  $("#streetFallback").hidden = true;
  $("#panoTitle").textContent = "3D 街景 · " + (scenes[sceneId].title || sceneId);
  renderStreetPick();
  const holder = $("#pano");
  holder.innerHTML = "";                        // 重建 viewer，避免叠图
  try {
    streetViewer = pannellum.viewer("pano", {
      default: { firstScene: sceneId, sceneFadeDuration: 800, autoLoad: true, showControls: true },
      scenes,
      autoLoad: true,
      showControls: true,
      // ⭐ 站长实测：72° 观感最好（minHfov = maxHfov = 72 → 真的锁死，缩放条也撤掉了）；
      //    并把默认视角往上抬 4°（视线稍向上，画面的天空/地面占比更舒服）
      hfov: 72, minHfov: 72, maxHfov: 72,   // 站长实测：72° 观感最好
      pitch: 4, yaw: 0,   // 视线上抬 4°
      showZoomCtrl: false, mouseZoom: false, touchZoom: false, disableKeyboardCtrl: true, backgroundColor: [0.42, 0.46, 0.45],   // 画布外万一露出来，用接近雾边的中性灰绿（Pannellum 要 0~1 的三元组）
      // 只做水平 360：锁住俯仰角，别让画面上下露出补出来的假天空/地面
      minPitch: -18, maxPitch: 18, pitch: 0,
      compass: false,
    });
    window.__sv = streetViewer;                    // 调试/自动化：暴露查看器
    // ⭐ 入口编辑器：双击画面放入口；进场景先应用已保存的入口
    setTimeout(() => {
      hsApply(sceneId);
      const el2 = $("#pano");
      if (el2 && !el2.__hsBound) {
        el2.__hsBound = true;
        el2.addEventListener("dblclick", onPanoDblClick);
        // ⭐ 主要入口：右键（左键被 Pannellum 的拖动环视占用了，双击到不了这里）
        el2.addEventListener("contextmenu", (ev) => { ev.preventDefault(); onPanoDblClick(ev); });
      }
      // 热点点击会在查看器内部切场景 → 监听场景变化，重新应用该场景的入口
      try {
        streetViewer.on("scenechange", () => { const sc = streetViewer.getScene(); if (sc) { streetScene = sc; $("#panoTitle").textContent = "3D 街景 · " + hsTitle(sc); hsApply(sc); renderStreetPick(); } });
      } catch { /* 事件名不支持就算了，靠 openStreetScene 兜底 */ }
    }, 300);
  } catch (e) {
    streetViewer = null;
    showStreetEmpty("查看器启动失败：" + (e && e.message ? e.message : e));
  }
}

function showStreetEmpty(msg) {
  const box = $("#streetFallback");
  if (!box) return;
  box.hidden = false;
  $("#streetFallbackMsg").textContent = msg || "";
}

/* ============================================================================
   街景入口编辑器：在画面里双击 → 放一个"去某个点位"的入口（Pannellum 场景热点）
     · 存 localStorage["beimingda.hotspots"] = { "<场景id>": [{target, pitch, yaw}] }
     · 可拖动微调；点入口即跳过去；「导出 JSON」给我固化进 pano/manifest.json
   ========================================================================== */
const HS_KEY = "beimingda.hotspots";
let hotspotStore = {};
try { hotspotStore = JSON.parse(localStorage.getItem(HS_KEY) || "{}") || {}; } catch { hotspotStore = {}; }
const hsIndexOf = (sceneId) => hotspotStore[sceneId] || (hotspotStore[sceneId] = []);
const hsCount = () => Object.values(hotspotStore).reduce((n, a) => n + a.length, 0);

function hsSave() {
  try {
    // ⛔ 内部字段（__id，用于删除热点）不要写进存储
    const clean = {};
    for (const [k, arr] of Object.entries(hotspotStore)) {
      clean[k] = arr.map((h) => ({ target: h.target, pitch: h.pitch, yaw: h.yaw }));
    }
    localStorage.setItem(HS_KEY, JSON.stringify(clean));
  } catch { /* 隐私模式：本次会话仍生效 */ }
  hsSyncUI();
}

function hsSyncUI() {
  const bar = $("#hsEditor");
  if (bar) bar.hidden = !(streetViewer && streetScene);
  const c = $("#hsCount");
  if (c) c.textContent = String(streetScene ? hsIndexOf(streetScene).length : 0) + (streetScene ? " 个入口" : "");
}

function hsTitle(sceneId) {
  const sc = (MANIFEST.scenes || {})[sceneId];
  return (sc && sc.title) || sceneId;
}

/** 在 DOM 里认领这个入口对应的热点 div（2.5.7 没有 getHotSpotDiv，只能按文案找） */
function hsClaimDiv(sceneId, hs, idx, tries = 8) {
  const key = sceneId + "|" + hs.target + "|" + idx;
  const find = () => {
    const nodes = [...document.querySelectorAll("#pano .pnlm-hotspot")];
    let div = nodes.find((d) => d.dataset && d.dataset.hsKey === key);
    if (div) return div;
    const label = "去 " + hsTitle(hs.target);
    div = nodes.find((d) => (d.textContent || "").trim() === label && !(d.dataset && d.dataset.hsKey));
    if (div) {
      div.dataset.hsKey = key;
      div.classList.add("hs-edit");
      return div;
    }
    return null;
  };
  const hit = find();
  if (hit || tries <= 0) return hit;
  setTimeout(() => hsClaimDiv(sceneId, hs, idx, tries - 1), 60);   // div 是异步插进来的
  return null;
}

/** 把一个入口画到查看器里（Pannellum 场景热点：点它 = 跳过去）+ 让它可拖动 */
function hsRender(sceneId, hs, idx) {
  if (!streetViewer) return;
  const id = "hs-" + sceneId + "-" + idx;
  hs.__id = id;
  try {
    // ⚠️ 不能传 cssClass：2.5.7 传了之后 addHotSpot 不生效
    streetViewer.addHotSpot({
      id, pitch: hs.pitch, yaw: hs.yaw, type: "scene", sceneId: hs.target,
      text: "去 " + hsTitle(hs.target),
    }, sceneId);
  } catch (e) { console.warn("[hs] addHotSpot 失败:", e); return; }

  const div = hsClaimDiv(sceneId, hs, idx);
  if (!div) return;
  let dragging = false, moved = false, raf = 0, lastCoords = null;
  const onMove = (ev) => {
    if (!dragging) return;
    moved = true;
    const co = hsCoordsFrom(ev);
    if (!co) return;
    lastCoords = co;
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      if (!lastCoords) return;
      hs.pitch = lastCoords[0]; hs.yaw = lastCoords[1];
      try { streetViewer.removeHotSpot(id, sceneId); } catch { /* 忽略 */ }
      hsRender(sceneId, hs, idx);                       // 就地重画（位置跟随鼠标）
    });
  };
  const onUp = () => {
    if (!dragging) return;
    dragging = false;
    div.classList.remove("is-dragging");
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
    if (moved) { hsSave(); toast("入口位置已保存（去 " + hsTitle(hs.target) + "）"); }
  };
  div.addEventListener("mousedown", (ev) => {
    ev.preventDefault(); ev.stopPropagation();
    dragging = true; moved = false;
    div.classList.add("is-dragging");
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
  div.addEventListener("click", (ev) => {
    if (moved) { ev.preventDefault(); ev.stopPropagation(); moved = false; }
    // 没拖动就按默认行为：跳过去
  });
}

function hsCoordsFrom(ev) {
  try {
    const c = streetViewer.mouseEventToCoords(ev);
    const one = Array.isArray(c[0]) ? c[0] : c;
    return [Number(one[0].toFixed(2)), Number(one[1].toFixed(2))];   // [pitch, yaw]
  } catch { return null; }
}

/** 应用某场景的全部入口（进场景/切场景都调一次） */
function hsApply(sceneId) {
  if (!streetViewer || !sceneId) return;
  hsIndexOf(sceneId).forEach((hs, i) => hsRender(sceneId, hs, i));
  hsSyncUI();
}

/** 当前视角中心（center +1 用） */
function hsCenterCoords() {
  try {
    const p = streetViewer.getPitch(), y = streetViewer.getYaw();
    return [Number(p.toFixed(2)), Number(y.toFixed(2))];
  } catch { return null; }
}

/** 画面事件（右键/双击）→ 取坐标 → 开选单 */
function onPanoDblClick(ev) {
  if (!streetViewer || !streetScene) return;
  const co = hsCoordsFrom(ev) || hsCenterCoords();
  if (!co) return;
  hsOpenPicker(co);
}

/** 给定 pitch/yaw，弹"去哪个点位"的选单 */
function hsOpenPicker(co) {
  if (!streetViewer || !streetScene) return;
  const targets = Object.keys(MANIFEST.scenes || {}).filter((id) => id !== streetScene);
  if (!targets.length) { toast("只有这一个场景，没有别处可去"); return; }
  const body = el("div", "stack stack--sm");
  body.appendChild(el("p", "small muted",
    "这个方向放一个去别处的入口（就在你双击的位置）。放完可以拖动微调，点它就是跳过去。"));
  const grid = el("div", "chip-row");
  targets.forEach((id) => {
    const used = hsIndexOf(streetScene).some((h) => h.target === id);
    const b = el("button", "chip" + (used ? " is-picked" : ""), hsTitle(id));
    b.type = "button";
    b.addEventListener("click", () => {
      const arr = hsIndexOf(streetScene);
      const exist = arr.find((h) => h.target === id);
      if (exist) { exist.pitch = co[0]; exist.yaw = co[1]; }        // 同名目标 = 移动它
      else arr.push({ target: id, pitch: co[0], yaw: co[1] });
      hsSave();
      hsApply(streetScene);
      sheet.close();
      toast("已放好入口：去「" + hsTitle(id) + "」（拖动可微调）");
    });
    grid.appendChild(b);
  });
  body.appendChild(grid);
  const sheet = createSheet({ title: "放一个「去这里」的入口", iconName: "map-pin", body });
  sheet.open();
}

/** 导出（给我固化进 pano/manifest.json） */
function hsExport() {
  const out = {};
  for (const [scene, arr] of Object.entries(hotspotStore)) {
    if (!arr.length) continue;
    out[scene] = arr.map((h) => ({ sceneId: h.target, pitch: h.pitch, yaw: h.yaw,
                                   text: "去 " + hsTitle(h.target) }));
  }
  const json = JSON.stringify({
    _comment: "由 /welcome 街景入口编辑器导出的热点（Pannellum hotSpots）。",
    _howto: "把 scenes 里每个场景的数组合并进 pano/manifest.json 对应场景的 hotSpots 即可。",
    _progress: hsCount() + " 个入口",
    scenes: out,
  }, null, 2);
  const body = el("div", "stack stack--sm");
  body.appendChild(el("p", "small muted", "共 " + hsCount() + " 个入口。复制发给管理员即可固化（已自动复制一份）。"));
  const pre = el("pre", "code code--scroll");
  pre.textContent = json;
  body.appendChild(pre);
  const f = el("div", "stack stack--sm");
  const b = el("button", "btn", "复制 JSON");
  b.type = "button";
  b.addEventListener("click", async () => {
    (await copyText(json)) ? toast("JSON 已复制") : toast("复制失败，请手动选中");
  });
  f.appendChild(b);
  createSheet({ title: "导出街景入口", iconName: "export", body, footer: f }).open();
  copyText(json).catch(() => {});
}

/** 打开 3D 街景：有点位就用它的场景，没有就按"如实提示 + 列出可用场景"处理 */
function enterStreet(nodeOrId) {
  const node = typeof nodeOrId === "string"
    ? NODES.find((n) => n.id === nodeOrId)
    : (nodeOrId || NODES.find((n) => n.id === currentId) || null);
  const ids = Object.keys(MANIFEST.scenes || {});
  $("#panoOverlay").classList.add("on");
  if (!ids.length) {
    showStreetEmpty("还没有任何 360° 实景素材。素材就位后（pano/manifest.json + pano/*.jpg）这里会自动播放，无需改代码。");
    renderStreetPick();
    return;
  }
  const scene = sceneOf(node);
  if (node && !scene) {
    // 从某个"没有实景"的点位进来：如实说明，同时让人还能看已拍好的点位
    openStreetScene(ids[0]);
    showStreetEmpty("「" + node.label + "」暂无 360° 实景素材 —— 我们不会拿别的图冒充实景；下面是已拍好的点位。");
    return;
  }
  // 从地图右上角「3D 街景」进来（或该点位有实景）：直接看，不要弹空态卡片
  $("#streetFallback").hidden = true;

}

function closeStreet() {

  if (holder) holder.innerHTML = "";             // 关掉 viewer，释放资源
  streetViewer = null;
  $("#panoOverlay").classList.remove("on");
}


/* ---------- 示意图底图缩放与平移（滑块 / 滚轮 / 拖动 / 双指） ----------
   ⚠️ 只缩放内层 #mapInner：#mapWrap 尺寸固定 + overflow:hidden，
      所以放大时画面只在框里放大，不会再"串出整个演示框"。
   ⚠️ transform-origin 用中心：滑块放大是以地图中心为锚点，不是左上角。 */
const zoomState = { z: 1, x: 0, y: 0, dragging: false, sx: 0, sy: 0 };

function clampPan() {
  const wrap = $("#mapWrap");
  if (!wrap) return;
  const maxX = ((zoomState.z - 1) * wrap.clientWidth) / 2;
  const maxY = ((zoomState.z - 1) * wrap.clientHeight) / 2;
  zoomState.x = Math.max(-maxX, Math.min(maxX, zoomState.x));
  zoomState.y = Math.max(-maxY, Math.min(maxY, zoomState.y));
}

function applyZoom() {
  const inner = $("#mapInner");
  if (!inner) return;
  clampPan();
  inner.style.transformOrigin = "50% 50%";
  inner.style.transform = "translate(" + zoomState.x + "px," + zoomState.y + "px) scale(" + zoomState.z + ")";
  layoutMarkers();          // 标记在独立图层里按像素重排：放大后不会变模糊
  const val = $("#zoomVal");
  if (val) val.textContent = Math.round(zoomState.z * 100) + "%";
  const rng = $("#zoomRange");
  if (rng) rng.value = String(Math.round(zoomState.z * 100));
  const hint = $("#zoomHint");
  if (hint) hint.hidden = zoomState.z <= 1.01;
}

function setZoom(z) {
  zoomState.z = Math.min(3.2, Math.max(1, Number(z.toFixed(2))));
  if (zoomState.z === 1) { zoomState.x = 0; zoomState.y = 0; }
  applyZoom();
}

/** 示意图上的点击：添加点位时把点击换算成底图百分比坐标 */

function setupMapZoom() {
  const wrap = $("#mapWrap");
  const rng = $("#zoomRange");
  if (!wrap) return;
  $("#zoomIn")?.addEventListener("click", () => setZoom(zoomState.z + 0.25));
  $("#zoomOut")?.addEventListener("click", () => setZoom(zoomState.z - 0.25));
  $("#zoomReset")?.addEventListener("click", () => setZoom(1));
  rng?.addEventListener("input", () => setZoom(Number(rng.value) / 100));
  wrap.addEventListener("wheel", (e) => {
    if (zoomState.z === 1 && e.deltaY > 0) return;
    e.preventDefault();
    setZoom(zoomState.z + (e.deltaY < 0 ? 0.15 : -0.15));
  }, { passive: false });
  wrap.addEventListener("pointerdown", (e) => {
    if (zoomState.z <= 1 || e.target.closest(".marker") || e.target.closest(".map-hud")) return;
    zoomState.dragging = true; zoomState.sx = e.clientX - zoomState.x; zoomState.sy = e.clientY - zoomState.y;
    wrap.setPointerCapture?.(e.pointerId);
  });
  wrap.addEventListener("pointermove", (e) => {
    if (!zoomState.dragging) return;
    zoomState.x = e.clientX - zoomState.sx; zoomState.y = e.clientY - zoomState.sy;
    applyZoom();
  });
  wrap.addEventListener("pointerup", () => { zoomState.dragging = false; });
  wrap.addEventListener("pointercancel", () => { zoomState.dragging = false; });
}


/* =============================================================================
   ⭐ 卫星图层（Leaflet，本地化）+ 3D 街景视图 + 自己在图上加点位
     · 为什么自建：高德 JS API 的域名白名单不接受 IP；官方 iframe 是跨域黑盒、叠不了我们的点位。
     · 配置：/map/map-bg.json 的 satellite 段（⛔ 页面不硬编码任何外部地址）。
     · 坐标：点位经纬度（WGS84）存 /map/sat-coords.json，用「添加点位」在图上标好后导出。
   ============================================================================= */
function satCfg() { return (BG && BG.satellite) || {}; }

/** GCJ-02 → WGS84（高德坐标 → 卫星影像坐标；不转会有几十到几百米错位） */
function gcj2wgs(lng, lat) {
  const a = 6378245.0, ee = 0.00669342162296594323;
  if (lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271) return { lng, lat };
  const tLat = (x, y) => {
    let r = -100 + 2 * x + 3 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
    r += ((20 * Math.sin(6 * x * Math.PI) + 20 * Math.sin(2 * x * Math.PI)) * 2) / 3;
    r += ((20 * Math.sin(y * Math.PI) + 40 * Math.sin((y / 3) * Math.PI)) * 2) / 3;
    r += ((160 * Math.sin((y / 12) * Math.PI) + 320 * Math.sin((y * Math.PI) / 30)) * 2) / 3;
    return r;
  };
  const tLng = (x, y) => {
    let r = 300 + x + 2 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
    r += ((20 * Math.sin(6 * x * Math.PI) + 20 * Math.sin(2 * x * Math.PI)) * 2) / 3;
    r += ((20 * Math.sin(x * Math.PI) + 40 * Math.sin((x / 3) * Math.PI)) * 2) / 3;
    r += ((150 * Math.sin((x / 12) * Math.PI) + 300 * Math.sin((x / 30) * Math.PI)) * 2) / 3;
    return r;
  };
  let dLat = tLat(lng - 105.0, lat - 35.0), dLng = tLng(lng - 105.0, lat - 35.0);
  const radLat = (lat / 180.0) * Math.PI;
  let magic = Math.sin(radLat);
  magic = 1 - ee * magic * magic;
  const sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180.0) / (((a * (1 - ee)) / (magic * sqrtMagic)) * Math.PI);
  dLng = (dLng * 180.0) / ((a / sqrtMagic) * Math.cos(radLat) * Math.PI);
  return { lng: lng * 2 - (lng + dLng), lat: lat * 2 - (lat + dLat) };
}

const satState = {
  map: null, base: null, labels: null, group: null, coords: {},
  onlyPano: false, addMode: false, newPoint: null, pendingId: "",
};

function satCoordsOf(node) {
  if (!node) return null;
  const c = satState.coords[node.id];
  if (c && c.lat && c.lng) return c;
  if (node.lat && node.lng) return gcj2wgs(Number(node.lng), Number(node.lat));
  return null;
}

/** 密集处气泡朝簇外指：先看整簇经度均值，偏左的点标签朝左、偏右的朝右，再上下错开 */
function labelSlotsFor(nodes) {
  const withCoord = nodes.map((n) => ({ n, c: satCoordsOf(n) })).filter((x) => x.c);
  const meanLng = withCoord.reduce((s, x) => s + x.c.lng, 0) / (withCoord.length || 1);
  const used = { left: 0, right: 0 };
  const slots = new Map();
  for (const { n, c } of withCoord) {
    const side = c.lng < meanLng ? "left" : "right";
    const dy = [0, -28, 28][used[side] % 3];
    used[side] += 1;
    slots.set(n.id, { side, dy });
  }
  return slots;
}

function renderSatMarkers() {
  if (!satState.map || !satState.group) return;
  satState.group.clearLayers();
  satState.labelSideFlip = false;
  const shown = NODES.filter((x) => !satState.onlyPano || sceneOf(x)).filter((x) => satCoordsOf(x));
  const labelSlot = labelSlotsFor(shown);   // 先算好每个点标签朝哪边、错多少
  let placed = 0;
  const calibrated = calibByName();
  for (const n of NODES) {
    if (satState.onlyPano && !sceneOf(n)) continue;      // 3D 街景视图只显示有实景的点位
    if (calibrated.has(n.id)) continue;                  // ⭐ 这个点位已被重新校准 → 旧位置隐藏
    const c = satCoordsOf(n);
    if (!c) continue;
    placed++;
    const hasPano = Boolean(sceneOf(n));
    // 常驻小气泡：标出"这是哪"，不用点开就能看到；点开才有「进入 3D 街景」
    const slot = labelSlot.get(n.id) || { side: "right", dy: 0 };
    const dy = slot.dy, side = slot.side;
    const icon = L.divIcon({
      className: "sat-marker cat-" + (n.category || "service") + (hasPano ? " has-pano" : "") + " side-" + side,
      html: '<span class="sat-marker__dot"></span><span class="sat-marker__label" style="margin-top:' + dy + 'px">' +
            esc(n.short || n.label) + '</span>',
      iconSize: [18, 18], iconAnchor: [9, 9],
    });
    const m = L.marker([c.lat, c.lng], { icon, title: n.label }).addTo(satState.group);
    if (hasPano) {
      // 点圆点 → 展开名称 + 进入街景入口；点地图别处自动收起（Leaflet 默认 closeOnClick）
      m.bindPopup(
        '<div class="sat-pop"><b>' + esc(n.label) + '</b>' +
        '<p class="small muted">' + esc(n.desc || "明湖一带的实拍实景") + '</p>' +
        '<button class="btn btn--sm" data-pano="' + n.id + '" type="button">进入 3D 街景</button></div>',
        { closeButton: false, offset: [0, -6] },
      );
      m.on("popupopen", (e) => {
        const btn = e.popup.getElement()?.querySelector("[data-pano]");
        btn?.addEventListener("click", () => { satState.map.closePopup(); enterStreet(n.id); });
      });
    } else if (customSpots.some((s) => s.id === n.id)) {
      m.bindPopup('<div class="sat-pop"><b>' + esc(n.label) + '</b><button class="btn btn--quiet btn--sm" data-del="' + n.id + '" type="button">删除这个点位</button></div>', { closeButton: false, offset: [0, -6] });
      m.on("popupopen", (e) => {
        e.popup.getElement()?.querySelector("[data-del]")?.addEventListener("click", () => {
          satState.map.closePopup(); removeSpot(n.id);
        });
      });
    } else {
      m.bindTooltip(n.label, { direction: "top", offset: [0, -10] });
    }
  }
  satState.placed = placed;
  renderCalibMarkers();          // ⭐ 画校准点（可拖动）
  calibSyncUI();                 // 工具条只在 3D 街景视图显示，每次渲染都同步一次
  updateSatTip();
}

function updateSatTip() {
  const el = $("#satTip");
  if (!el) return;
  const placed = satState.placed || 0;
  const panoTotal = NODES.filter((n) => sceneOf(n)).length;
  if (satState.addMode) {
    el.textContent = "添加点位模式：在图上点一下要放的位置（点「添加点位」可以取消）";
    return;
  }
  if (satState.onlyPano) {
    el.textContent = panoTotal
      ? "3D 街景：卫星底图上有 " + panoTotal + " 个实景点位（点圆点看名称与入口）"
      : "3D 街景：还没有实景点位被定位 —— 点「添加点位」在图上加，导出后我固化。";
    return;
  }
  el.textContent = placed
    ? "卫星图层：已定位 " + placed + " 个点位（点圆点看详情）"
    : "卫星图层已就绪。还没有点位坐标 —— 点「添加点位」在图上逐个点出位置，导出后我固化。";
}

/** 示意图的缩放条只在示意图视图显示（卫星图有自己的缩放控件） */
function syncZoomUI(mode) {
  const z = document.querySelector(".map-zoom");
  if (z) z.hidden = mode !== "shot";
}

function useSatBase() {
  const cfg = satCfg();
  if (!cfg.enabled || !cfg.tile_url_template) {
    amapTip("卫星图层未配置（/map/map-bg.json 的 satellite 段）");
    return useShotBase();
  }
  $("#mapWrap").hidden = true;
  $("#amapWrap").hidden = true;
  $("#satWrap").hidden = false;
  syncZoomUI("sat");
  syncZoomUI("sat");
  if (!satState.map) {
    const c = gcj2wgs((cfg.center && cfg.center.lng) || 106.1077, (cfg.center && cfg.center.lat) || 38.4977);
    satState.map = L.map("satMap", {
      center: [c.lat, c.lng],
      zoom: cfg.zoom || 16,
      minZoom: cfg.min_zoom || 14,
      maxZoom: cfg.max_zoom || 19,
      zoomControl: true,
    });
    // ⭐ 限制在校园范围：别滑出去找不到学校
    if (cfg.bounds) {
      const b = cfg.bounds;
      satState.map.setMaxBounds([[b.south, b.west], [b.north, b.east]]);
      satState.map.options.maxBoundsViscosity = 1.0;
    }
    satState.base = L.tileLayer(cfg.tile_url_template, { maxZoom: cfg.max_zoom || 19, attribution: cfg.attribution || "" }).addTo(satState.map);
    if (cfg.label_tile_url_template && cfg.labels_default_on !== false) {
      satState.labels = L.tileLayer(cfg.label_tile_url_template, { maxZoom: cfg.max_zoom || 19 }).addTo(satState.map);
    }
    satState.group = L.layerGroup().addTo(satState.map);
    satState.map.on("click", onSatClick);
    satState.map.on("dblclick", onSatDblClick);      // ⭐ 左键双击 = 放下一个点位
    const credit = $("#satCredit");
    if (credit) credit.textContent = cfg.attribution || "";
  }
  setTimeout(() => satState.map.invalidateSize(), 60);
  renderSatMarkers();
  setBasePressed("sat");
}

/** 3D 街景视图：沿用卫星底图，只放实景点位 */
function useStreetView3D() {
  satState.onlyPano = true;
  useSatBase();
  updateSatTip();
}

/** 图上点击：添加新点位 / 给现有点位定位 */
function onSatClick() { /* 单点交给 Leaflet 默认行为（点开标记气泡）；加点走双击 */ }

/* ============================================================================
   点位校准：双击地图 → 从"还没用过的名字"里选 → 在该处放一个可拖动的点
     · 名字沿用 sat-coords.json 里现有的 8 个，用过就不再出现（加完一个少一个）
     · 拖完自动存 localStorage；点标记可复制坐标或删除
     · 「导出 JSON」把结果给我，我固化进 static/map/sat-coords.json
   ========================================================================== */
const CALIB_KEY = "beimingda.calib";
let calib = [];
try { calib = JSON.parse(localStorage.getItem(CALIB_KEY) || "[]") || []; } catch { calib = []; }
const calibByName = () => new Map(calib.map((c) => [c.id, c]));

function calibSave() {
  try { localStorage.setItem(CALIB_KEY, JSON.stringify(calib)); } catch { /* 隐私模式下本次会话仍生效 */ }
  calibSyncUI();
  renderSatMarkers();
}

function calibSyncUI() {
  const bar = $("#satEditor");
  if (bar) bar.hidden = !satState.onlyPano;   // 只在 3D 街景视图里显示校准工具条
  const total = (satState.pool || []).length || 8;
  const c = $("#calibCount");
  if (c) c.textContent = calib.length + "/" + total;
}

/** 把 WGS84 反推成 GCJ-02（导出时附上，方便和站长给的高德坐标对齐） */
function wgs2gcj(lng, lat) {
  const a = 6378245.0, ee = 0.00669342162296594323;
  const dlat = (x, y) => {
    let r = -100 + 2 * x + 3 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
    r += (20 * Math.sin(6 * x * Math.PI) + 20 * Math.sin(2 * x * Math.PI)) * 2 / 3;
    r += (20 * Math.sin(y * Math.PI) + 40 * Math.sin(y / 3 * Math.PI)) * 2 / 3;
    r += (160 * Math.sin(y / 12 * Math.PI) + 320 * Math.sin(y * Math.PI / 30)) * 2 / 3;
    return r;
  };
  const dlng = (x, y) => {
    let r = 300 + x + 2 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
    r += (20 * Math.sin(6 * x * Math.PI) + 20 * Math.sin(2 * x * Math.PI)) * 2 / 3;
    r += (20 * Math.sin(x * Math.PI) + 40 * Math.sin(x / 3 * Math.PI)) * 2 / 3;
    r += (150 * Math.sin(x / 12 * Math.PI) + 300 * Math.sin(x / 30 * Math.PI)) * 2 / 3;
    return r;
  };
  let dLat = dlat(lng - 105.0, lat - 35.0), dLng = dlng(lng - 105.0, lat - 35.0);
  const rad = lat / 180.0 * Math.PI;
  const magic = 1 - ee * Math.sin(rad) * Math.sin(rad);
  const sq = Math.sqrt(magic);
  dLat = dLat * 180.0 / ((a * (1 - ee) / (magic * sq)) * Math.PI);
  dLng = dLng * 180.0 / ((a / sq) * Math.cos(rad) * Math.PI);
  return { lat: lat + dLat, lng: lng + dLng };
}

/** 双击地图：选名字 → 落点 */
function onSatDblClick(e) {
  const lat = Number(e.latlng.lat.toFixed(6)), lng = Number(e.latlng.lng.toFixed(6));
  const pool = satState.pool || [];
  const usedIds = new Set(calib.map((c) => c.id));
  const rest = pool.filter((p) => !usedIds.has(p.id));
  if (!pool.length) { toast("点位名单还没加载好，稍等一下再双击"); return; }
  if (!rest.length) { toast("8 个名字都用完了；要重来先点左下角「清空」"); return; }

  const body = el("div", "stack stack--sm");
  body.appendChild(el("p", "small muted",
    "在这个位置放哪个点位？（名字沿用现有这 8 个，放过的就不再出现）"));
  const grid = el("div", "chip-row");
  rest.forEach((p) => {
    const b = el("button", "chip", p.short || p.label);
    b.type = "button";
    b.title = p.label;
    b.addEventListener("click", () => {
      // 防重：同名点位已存在就"移动它"，不要加出两个同名点
      const exist = calib.find((c) => c.id === p.id);
      if (exist) { exist.lat = lat; exist.lng = lng; }
      else calib.push({ id: p.id, label: p.label, short: p.short || "", pano_scene: p.pano_scene || null, lat, lng });
      calibSave();
      sheet.close();
      const left = pool.length - calib.length;
      toast("已放下「" + p.label + "」，还剩 " + left + " 个名字");
    });
    grid.appendChild(b);
  });
  body.appendChild(grid);
  const tip = el("p", "small muted", "放下后可以直接**拖动**微调；点它可复制坐标或删除。");
  body.appendChild(tip);
  const sheet = createSheet({ title: "在这里放一个点位", iconName: "map-pin", body });
  sheet.open();
}

/** 画校准点（可拖动）——已放过的名字，原来的旧点自动隐藏 */
function renderCalibMarkers() {
  if (!satState.map) return;
  const byId = calibByName();
  for (const c of calib) {
    const icon = L.divIcon({
      className: "sat-marker sat-marker--draft side-right",
      html: '<span class="sat-marker__dot"></span><span class="sat-marker__label">' +
            esc(c.short || c.label) + '</span>',
      iconSize: [18, 18], iconAnchor: [9, 9],
    });
    const m = L.marker([c.lat, c.lng], { icon, draggable: true, title: c.label + "（拖动校准）" })
      .addTo(satState.group);
    m.on("dragstart", () => m.getElement()?.classList.add("is-dragging"));
    m.on("dragend", () => {
      const p = m.getLatLng();
      c.lat = Number(p.lat.toFixed(6)); c.lng = Number(p.lng.toFixed(6));
      calibSave();
      toast("已更新「" + c.label + "」的位置");
    });
    m.bindPopup(
      '<div class="sat-pop"><b>' + esc(c.label) + '</b>' +
      '<p class="small muted">' + c.lat.toFixed(6) + ", " + c.lng.toFixed(6) + '</p>' +
      '<p class="small muted">拖动这个点即可微调</p>' +
      '<button class="btn btn--sm" data-copy-calib="' + c.id + '" type="button">复制坐标</button> ' +
      '<button class="btn btn--sm btn--ghost" data-del-calib="' + c.id + '" type="button">删除</button></div>');
  }
  // 弹层里的两个按钮（Leaflet 弹层是动态生成，用事件委托）
  satState.map.off("popupopen").on("popupopen", (ev) => {
    const root = ev.popup.getElement();
    root?.querySelector("[data-copy-calib]")?.addEventListener("click", async () => {
      const c = calib.find((x) => x.id === root.querySelector("[data-copy-calib]").dataset.copyCalib);
      if (!c) return;
      const g = wgs2gcj(c.lng, c.lat);
      const txt = c.lat.toFixed(6) + "," + c.lng.toFixed(6) + "  (GCJ " + g.lat.toFixed(6) + "," + g.lng.toFixed(6) + ")";
      (await copyText(txt)) ? toast("坐标已复制：" + txt) : toast(txt);
    });
    root?.querySelector("[data-del-calib]")?.addEventListener("click", () => {
      const id = root.querySelector("[data-del-calib]").dataset.delCalib;
      calib = calib.filter((x) => x.id !== id);
      satState.map.closePopup();
      calibSave();
      toast("已删掉这个校准点（名字回到可用列表）");
    });
  });
}

/** 导出 JSON（给站长/我固化） */
function exportCalib() {
  const total = (satState.pool || []).length || 8;
  const points = calib.map((c) => {
    const g = wgs2gcj(c.lng, c.lat);
    return {
      id: c.id, label: c.label, short: c.short || null,
      category: (satState.pool.find((p) => p.id === c.id) || {}).category || "service",
      note: c.label + "（实拍 360°）", color: "#2E8B76",
      pano_scene: c.pano_scene, lat: c.lat, lng: c.lng,
      gcj02: { lat: Number(g.lat.toFixed(6)), lng: Number(g.lng.toFixed(6)) },
    };
  });
  const json = JSON.stringify({
    _comment: "由 /welcome 的定位校准导出的点位坐标（WGS84 供本站卫星图层用；gcj02 供高德对照）",
    _progress: calib.length + "/" + total,
    points,
  }, null, 2);
  const body = el("div", "stack stack--sm");
  body.appendChild(el("p", "small muted",
    "已校准 " + calib.length + "/" + total + "。把下面这段发给管理员即可固化（也自动复制了一份到剪贴板）。"));
  const pre = el("pre", "code code--scroll");
  pre.textContent = json;
  body.appendChild(pre);
  const sheet = createSheet({ title: "导出校准结果", iconName: "export", body,
    footer: (() => {
      const f = el("div", "stack stack--sm");
      const b = el("button", "btn", "复制 JSON");
      b.type = "button";
      b.addEventListener("click", async () => {
        (await copyText(json)) ? toast("JSON 已复制") : toast("复制失败，请手动选中复制");
      });
      f.appendChild(b);
      return f;
    })() });
  sheet.open();
  copyText(json).catch(() => {});
}

/** 自定义点位：存在 localStorage，刷新/切视图都不丢；可删、可导出（导出后我固化） */
const SPOT_KEY = "beimingda.spots";
let customSpots = [];
try { customSpots = JSON.parse(localStorage.getItem(SPOT_KEY) || "[]") || []; } catch { customSpots = []; }

function saveSpots() {
  try { localStorage.setItem(SPOT_KEY, JSON.stringify(customSpots)); } catch { /* 隐私模式：本次会话内仍生效 */ }
}

/** 把自定义点位并进三套数据：底图百分比、卫星经纬度、点位列表 */
function applySpots() {
  for (const s of customSpots) {
    if (!NODES.some((n) => n.id === s.id)) {
      NODES.push({
        id: s.id, label: s.label, category: s.category || "service",
        desc: s.note || "", color: s.color || "",
        pano_url: s.pano_scene ? "/pano/" + s.pano_scene + ".jpg" : null, lat: 0, lng: 0,
      });
    } else {
      const n = NODES.find((x) => x.id === s.id);
      n.label = s.label; n.desc = s.note || n.desc;
      if (s.pano_scene) n.pano_url = "/pano/" + s.pano_scene + ".jpg";
    }
    if (typeof s.x_pct === "number" && typeof s.y_pct === "number") {
      BG.points = BG.points || {};
      BG.points[s.id] = { x_pct: s.x_pct, y_pct: s.y_pct };
    }
    if (s.lat && s.lng) satState.coords[s.id] = { lat: Number(s.lat), lng: Number(s.lng) };
  }
}

function addCustomSpot(coord) {
  const draft = satState.newPoint || {};
  const id = "spot-" + Date.now().toString(36) + Math.floor(Math.random() * 90 + 10);
  const spot = {
    id,
    label: (draft.label || "").trim() || "未命名点位",
    category: draft.category || "service",
    note: (draft.note || "").trim(),
    color: draft.color || "",
    pano_scene: draft.pano_scene || "",
    ...coord,
  };
  customSpots.push(spot);
  saveSpots();
  applySpots();
  renderSatMarkers();
  satState.addMode = false;
  toast("已添加「" + spot.label + "」。接着加下一个吧（名字再输一次）。");
}

function removeSpot(id) {
  const s = customSpots.find((x) => x.id === id);
  customSpots = customSpots.filter((x) => x.id !== id);
  saveSpots();
  const i = NODES.findIndex((n) => n.id === id);
  if (i >= 0) NODES.splice(i, 1);
  if (BG.points) delete BG.points[id];
  delete satState.coords[id];
  renderSatMarkers();
  toast("已删除「" + (s ? s.label : id) + "」");
}


(async function init() {
  const [nodes, bg, manifest] = await Promise.all([
    getApiData("/api/map/nodes", []),          // ⚠️ 走信封解包，不能再直接当数组
    getJson("/map/map-bg.json", BG),
    getJson("/pano/manifest.json", MANIFEST)
  ]);
  NODES = Array.isArray(nodes) ? nodes : [];
  BG = Object.assign(BG, bg || {});
  MANIFEST = Object.assign(MANIFEST, manifest || {});
  if (BG.image) $("#baseImg").src = BG.image;

  // ⭐ 卫星图点位坐标（「添加点位」导出后覆盖 static/map/sat-coords.json 即生效，无需改代码）
  const satCo = await getJson("/map/sat-coords.json", null);
  // ⭐ 点位名字池：双击加点时"从没用过的名字里挑"，加完一个少一个
  satState.pool = (satCo && Array.isArray(satCo.points) ? satCo.points : []).map((p) => ({
    id: p.id, label: p.label, short: p.short || null,
    category: p.category || "service", pano_scene: p.pano_scene || null,
  }));
  if (satCo && Array.isArray(satCo.points)) {
    for (const p of satCo.points) {
      if (p.id && p.lat && p.lng) satState.coords[p.id] = { lat: Number(p.lat), lng: Number(p.lng) };
      if (p.id && Array.isArray(NODES) && !NODES.some((n) => n.id === p.id)) {
        NODES.push({
          id: p.id, label: p.label || "实景点位", short: p.short || null, category: p.category || "service",
          desc: p.note || "", color: p.color || "",
          pano_url: p.pano_scene ? "/pano/" + p.pano_scene + ".jpg" : null,   // ⭐ 绑定实景素材
          lat: 0, lng: 0,
        });
      } else if (p.id) {
        const n = NODES.find((x) => x.id === p.id);
        if (n && p.label) n.label = p.label;
        if (n && p.short) n.short = p.short;
        if (n && p.note) n.desc = p.note;
        if (n && p.pano_scene) n.pano_url = "/pano/" + p.pano_scene + ".jpg";
      }
    }
  }

  // ⭐ 人工标注（/tools/annotate.html 导出后放到 static/map/annotations.json 即生效，无需改代码）
  const anno = await getJson("/map/annotations.json", null);
  if (anno && Array.isArray(anno.points)) {
    for (const p of anno.points) {
      const id = p.id || ("anno-" + Math.random().toString(36).slice(2, 8));
      if (BG.points && typeof p.x_pct === "number") BG.points[id] = { x_pct: p.x_pct, y_pct: p.y_pct };
      if (!NODES.some((n) => n.id === id)) {
        NODES.push({ id, label: p.note || "人工标注", category: p.category || "service", color: p.color || "", desc: p.note || "", lat: 0, lng: 0 });
      }
    }
  }

  // 套用本地保存的自定义点位（刷新/切页都不丢）
  applySpots();
  setupMapHud();
  setupMapZoom();

  // ⚠️ 口径：有实景 = 该节点能通过 pano_url 关联到 manifest 里的场景（不是拿节点 id 去猜场景 id）
  const panoCount = NODES.filter((n) => Boolean(sceneOf(n))).length;
  $("#source").textContent = (BG.attribution || "底图为示意截图") +
    " · 底图只做缩放浏览，点位标注已移到「3D 街景」（卫星底图）上，共 " + panoCount + " 处实景";

  // ⭐ 街景入口编辑器工具条
  $("#hsAddCenter")?.addEventListener("click", () => {
    const co = hsCenterCoords();
    if (!co) { toast("查看器还没就绪"); return; }
    hsOpenPicker(co);
  });
  $("#hsExport")?.addEventListener("click", hsExport);
  $("#hsUndo")?.addEventListener("click", () => {
    const arr = streetScene ? hsIndexOf(streetScene) : [];
    if (!arr.length) { toast("当前场景还没有入口"); return; }
    const last = arr.pop();
    hsSave();
    if (streetViewer) { try { streetViewer.removeHotSpot(last.__id, streetScene); } catch { /* 忽略 */ } }
    toast("已撤销一个入口");
  });
  $("#hsClear")?.addEventListener("click", () => {
    if (!streetScene) return;
    const arr = hsIndexOf(streetScene);
    arr.forEach((h) => { if (streetViewer && h.__id) { try { streetViewer.removeHotSpot(h.__id, streetScene); } catch { /* 忽略 */ } } });
    hotspotStore[streetScene] = [];
    hsSave();
    toast("已清空本场景的入口");
  });

  // ⭐ 点位校准工具条
  $("#calibExport")?.addEventListener("click", exportCalib);
  $("#calibUndo")?.addEventListener("click", () => {
    if (!calib.length) { toast("还没有校准点"); return; }
    const last = calib.pop();
    calibSave();
    toast("已撤销「" + last.label + "」，名字回到可用列表");
  });
  $("#calibClear")?.addEventListener("click", () => {
    if (!calib.length) { toast("还没有校准点"); return; }
    calib = []; calibSave();
    toast("已清空校准点（8 个名字都可用了）");
  });
  calibSyncUI();

  setupCalibrate();                       // ?calibrate=1 时才生效（坐标由人对着底图点出来，不猜）

  // ⭐ 深链：?pano=<sceneId> 直接进 3D 街景（MCP 的 app_open_view 生成的就是这个）
  const wantPano = new URLSearchParams(location.search).get("pano");
  if (wantPano) {
    useStreetView3D();
    openStreetScene(wantPano);
    toast("已按链接打开实景：" + wantPano);
  }

  })();
</script>
