<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>迎新导览 · 北名大小助手</title>
  <link rel="stylesheet" href="/vendor/pannellum/pannellum.css" />
  <style>
    :root {
      --pri: #1F4E8C; --ok: #2E8B76; --warn: #C0392B; --bg: #F5F7FA;
      --card: #FFFFFF; --line: #E3E8EF; --muted: #5B6470;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: #1C1C1E;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    header { background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 18px; }
    header h1 { margin: 0 0 4px; font-size: 19px; color: var(--pri); }
    header p { margin: 0; font-size: 13px; color: var(--muted); }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 14px 14px 40px; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 12px; }
    .chip { border: 1px solid var(--line); background: #fff; color: var(--muted);
      padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; }
    .chip[aria-pressed="true"] { background: var(--pri); border-color: var(--pri); color: #fff; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; align-items: start; }
    .map-card { background: var(--card); border-radius: 12px; padding: 10px;
      box-shadow: 0 1px 3px rgba(16,24,40,.08); }
    .map-wrap { position: relative; width: 100%; overflow: hidden; border-radius: 8px; }
    .map-wrap img.base { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
    .marker { position: absolute; transform: translate(-50%, -100%); cursor: pointer;
      background: none; border: 0; padding: 0; line-height: 1; }
    .marker .dot { display: block; width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
    .marker .tag { display: block; margin-top: 3px; font-size: 11px; background: rgba(255,255,255,.92);
      border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; white-space: nowrap; }
    .marker[data-cat="dorm"] .dot     { background: #1F4E8C; }
    .marker[data-cat="canteen"] .dot  { background: #E08C1B; }
    .marker[data-cat="teaching"] .dot { background: #2E8B76; }
    .marker[data-cat="gate"] .dot     { background: #7A5AF8; }
    .marker[data-cat="service"] .dot  { background: #C0392B; }
    .marker[aria-current="true"] .dot { outline: 3px solid rgba(31,78,140,.35); }
    .marker[hidden] { display: none; }
    .source { margin: 8px 2px 0; font-size: 12px; color: var(--muted); }
    .panel { background: var(--card); border-radius: 12px; padding: 16px;
      box-shadow: 0 1px 3px rgba(16,24,40,.08); position: sticky; top: 14px; }
    .panel h2 { margin: 0 0 6px; font-size: 17px; }
    .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px;
      background: rgba(31,78,140,.1); color: var(--pri); margin-right: 6px; }
    .badge.pano-on  { background: rgba(46,139,118,.14); color: var(--ok); }
    .badge.pano-off { background: rgba(192,57,43,.12); color: var(--warn); }
    .panel p.desc { font-size: 14px; line-height: 1.65; color: #333; }
    .notice { font-size: 13px; background: #FFF8E6; border: 1px solid #F0DFAC; color: #6B5A18;
      border-radius: 8px; padding: 8px 10px; margin: 10px 0 0; }
    button.primary { background: var(--pri); color: #fff; border: 0; border-radius: 8px;
      padding: 9px 14px; font-size: 14px; cursor: pointer; }
    #panoOverlay { position: fixed; inset: 0; background: #000; display: none; z-index: 50; }
    #panoOverlay.on { display: block; }
    #pano { width: 100%; height: 100%; }
    .pano-bar { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 2;
      display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .pano-bar .title { color: #fff; font-size: 15px; background: rgba(0,0,0,.45);
      padding: 6px 12px; border-radius: 8px; }
    .pano-bar button { background: rgba(0,0,0,.55); color: #fff; border: 1px solid rgba(255,255,255,.35);
      border-radius: 8px; padding: 6px 12px; cursor: pointer; }
    #demoBadge { position: fixed; right: 12px; top: 12px; background: var(--warn); color: #fff;
      font-size: 12px; padding: 4px 10px; border-radius: 999px; display: none; z-index: 60; }
    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      .panel { position: static; }
      .marker .tag { display: none; }
      .marker .dot { width: 18px; height: 18px; }
    }
  </style>
</head>
<body>
<div id="demoBadge">演示模式</div>

<header>
  <h1>迎新导览 · 校园地图</h1>
  <p>点击地图上的标记，可以先看看那里长什么样 —— 宿舍楼、食堂、教学楼、校门、快递驿站都在这里。</p>
</header>

<div class="wrap">
  <div class="chips" id="chips">
    <button class="chip" data-cat="" aria-pressed="true">全部</button>
    <button class="chip" data-cat="dorm">宿舍楼</button>
    <button class="chip" data-cat="canteen">食堂</button>
    <button class="chip" data-cat="teaching">教学与自习</button>
    <button class="chip" data-cat="gate">校门</button>
    <button class="chip" data-cat="service">服务设施</button>
  </div>

  <div class="layout">
    <div class="map-card">
      <div class="map-wrap" id="mapWrap">
        <img class="base" id="baseImg" src="/map/campus-map.svg" alt="校园示意图底图" />
        <!-- 标记由 JS 按 /map/map-bg.json 的百分比坐标渲染 -->
      </div>
      <p class="source" id="source"></p>
    </div>

    <aside class="panel" id="panel">
      <h2>选一个地点</h2>
      <p class="desc">左侧地图上的每个彩色圆点都是一个位置。点一下，这里会显示它的位置说明；
        如果有 360° 实景，会出现「查看 360° 实景」按钮。</p>
      <p id="summary" class="desc" style="color:var(--muted);font-size:13px"></p>
    </aside>
  </div>
</div>

<div id="panoOverlay">
  <div class="pano-bar">
    <span class="title" id="panoTitle">360° 实景</span>
    <button id="panoClose" type="button">关闭</button>
  </div>
  <div id="pano"></div>
</div>

<script src="/vendor/pannellum/pannellum.js"></script>
<script src="/config.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const CAT_LABEL = { dorm: "宿舍楼", canteen: "食堂", teaching: "教学与自习", gate: "校门", service: "服务设施" };

if (new URLSearchParams(location.search).get("demo") === "1") {
  $("#demoBadge").style.display = "block";
}

let NODES = [];
let BG = { image: "/map/campus-map.svg", points: {}, attribution: "" };
let MANIFEST = { default: { firstScene: "", sceneFadeDuration: 800 }, scenes: {} };
let filter = "";

async function getJson(url, fallback) {
  try {
    const r = await fetch(url);
    if (!r.ok) return fallback;
    return await r.json();
  } catch { return fallback; }
}

function catLabel(c) { return CAT_LABEL[c] || c; }

function renderMarkers() {
  const wrap = $("#mapWrap");
  wrap.querySelectorAll(".marker").forEach((el) => el.remove());
  for (const n of NODES) {
    const p = BG.points[n.id];
    if (!p) continue;                                   // 未标坐标的节点不显示（不猜位置）
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "marker";
    btn.dataset.id = n.id;
    btn.dataset.cat = n.category;
    btn.style.left = p.x_pct + "%";
    btn.style.top = p.y_pct + "%";
    const hasPano = Boolean(n.pano_url) && Boolean(MANIFEST.scenes[n.id]);
    btn.innerHTML = '<span class="dot"></span><span class="tag">' + n.label +
      (hasPano ? ' · 实景' : '') + '</span>';
    btn.setAttribute("aria-label", n.label + "（" + catLabel(n.category) + "）");
    btn.hidden = Boolean(filter) && n.category !== filter;
    btn.addEventListener("click", () => selectNode(n.id));
    wrap.appendChild(btn);
  }
}

function selectNode(id) {
  const n = NODES.find((x) => x.id === id);
  if (!n) return;
  document.querySelectorAll(".marker").forEach((el) => {
    el.setAttribute("aria-current", el.dataset.id === id ? "true" : "false");
  });
  const hasPano = Boolean(n.pano_url) && Boolean(MANIFEST.scenes[n.id]);
  $("#panel").innerHTML = [
    '<h2>' + n.label + '</h2>',
    '<div><span class="badge">' + catLabel(n.category) + '</span>' +
      '<span class="badge ' + (hasPano ? "pano-on" : "pano-off") + '">' +
      (hasPano ? "有 360° 实景" : "暂无实景") + '</span></div>',
    '<p class="desc">' + (n.desc || "（暂无位置描述）") + '</p>',
    hasPano
      ? '<button class="primary" id="openPano" type="button">查看 360° 实景</button>'
      : '<p class="notice">该点暂无实景，以下是位置描述 —— 我们不会拿别的图糊弄你。</p>'
  ].join("");
  const open = $("#openPano");
  if (open) open.addEventListener("click", () => openPano(id));
}

function openPano(sceneId) {
  const sceneIds = Object.keys(MANIFEST.scenes);
  if (!sceneIds.length) return;
  const first = MANIFEST.scenes[sceneId] ? sceneId : sceneIds[0];
  $("#panoTitle").textContent = (MANIFEST.scenes[first] && MANIFEST.scenes[first].title) || "360° 实景";
  $("#panoOverlay").classList.add("on");
  pannellum.viewer("pano", {
    default: { firstScene: first, sceneFadeDuration: MANIFEST.default.sceneFadeDuration || 800 },
    scenes: MANIFEST.scenes,
    autoLoad: true,
    showControls: true
  });
}

$("#panoClose").addEventListener("click", () => {
  const c = $("#pano");
  c.innerHTML = "";                                     // 关掉 viewer，释放资源
  $("#panoOverlay").classList.remove("on");
});

$("#chips").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  filter = chip.dataset.cat || "";
  document.querySelectorAll(".chip").forEach((c) =>
    c.setAttribute("aria-pressed", c === chip ? "true" : "false"));
  renderMarkers();
});

(async function init() {
  const [nodes, bg, manifest] = await Promise.all([
    getJson("/api/map/nodes", []),
    getJson("/map/map-bg.json", BG),
    getJson("/pano/manifest.json", MANIFEST)
  ]);
  NODES = Array.isArray(nodes) ? nodes : [];
  BG = Object.assign(BG, bg || {});
  MANIFEST = Object.assign(MANIFEST, manifest || {});
  if (BG.image) $("#baseImg").src = BG.image;
  $("#source").textContent = (BG.attribution || "底图为示意截图，非在线地图服务") +
    " · 共 " + NODES.length + " 个点位，其中 " +
    NODES.filter((n) => n.pano_url && MANIFEST.scenes[n.id]).length + " 个已拍摄 360° 实景";
  renderMarkers();
  $("#summary").textContent = NODES.length
    ? "点位类别：" + [...new Set(NODES.map((n) => catLabel(n.category)))].join(" / ")
    : "节点数据未加载（后端 /api/map/nodes 未就绪？先跑 npm run seed）";
})();
</script>
</body>
</html>
